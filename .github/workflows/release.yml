# 「iML 编辑器」的发版流水线：打 lite-v* 标签时构建 macOS（arm64 / x64）与 Windows 安装包、绿色版，发布到同名 Release。
# 标签沿用 lite-v 前缀：拆成独立仓库之前和「iML 笔记」同仓库时靠它区分，应用里的检查更新按这个前缀认版本，老版本都是它。
# make_latest 仍是 false：拆仓库前为了不顶掉笔记那边的 /releases/latest；现在单独仓库了，想让 Releases 页显示「Latest」徽章可以改成 true。
# 也可在 Actions 页手动触发（填标签名）。
name: Release (iML 编辑器)

on:
  push:
    tags: ['lite-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 lite-v26.4.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-arm64,   os: macos-14,       target: aarch64-apple-darwin,     arch: arm64, bundles: app }
          - { name: macOS-x64,     os: macos-14,       target: x86_64-apple-darwin,      arch: x64,   bundles: app }
          - { name: Windows-x64,   os: windows-latest, target: x86_64-pc-windows-msvc,   arch: x64,   bundles: nsis }
          - { name: Windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc,  arch: arm64, bundles: nsis }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      # 真的把它跑起来：26.4.2 在 Windows 上一启动就崩（#5），而构建和测试全是绿的。
      # 撑不过 15 秒、或者界面没起来，这一版就不发。只查能在这台机器上直接跑的架构
      - name: Launch check (Windows)
        if: matrix.name == 'Windows-x64'
        shell: pwsh
        run: |
          # 界面跑在 WebView2 里：这台机器上没有就先装上，免得把「机器没装」当成「应用起不来」
          $installed = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' |
            Where-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv }
          if (-not $installed) {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/MicrosoftEdgeWebview2Setup.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP/MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent', '/install' -Wait
          }
          $exe = (Resolve-Path "src-tauri/target/${{ matrix.target }}/release/iml-editor.exe").Path
          $started = Get-Date
          $app = Start-Process -FilePath $exe -PassThru
          # 至少撑 15 秒；界面起得慢就多等一会儿，最多一分钟
          $webview = $null
          foreach ($second in 1..60) {
            Start-Sleep -Seconds 1
            if ($app.HasExited) { throw "启动后 $second 秒退出了" }
            if (-not $webview) { $webview = Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue }
            if ($webview -and $second -ge 15) { break }
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $webview) { throw "进程还在，但界面（WebView2）没有起来" }
          # 崩了但进程被系统的报错窗口拖着没退的情形：系统日志里会记一笔。日志里没有记录时这条命令会报错，当作没有
          $crashes = try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error'; StartTime = $started } -ErrorAction Stop |
              Where-Object { $_.Message -match 'iml-editor\.exe' }
          } catch { $null }
          if ($crashes) { throw "启动后崩溃了：$(@($crashes)[0].Message)" }
      - name: Launch check (macOS)
        if: matrix.name == 'macOS-arm64'
        shell: bash
        run: |
          APP=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          "$APP/Contents/MacOS/iml-editor" &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then echo "启动后 15 秒内退出了"; exit 1; fi
          kill "$PID"
      # macOS：Tauri 只出 .app，dmg 在这里自己打。
      # 它自带的 bundle_dmg.sh 在 GitHub 的 macOS 机器上时好时坏（hdiutil 报 Resource busy，几秒就退出，第一次发版就栽在这儿）；
      # 自己打可以重试，文件名直接是英文，还能用 LZMA（ULMO，macOS 10.15 起都能开）——比默认的 zlib 小一成多
      - name: Make dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict "$APP"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE" release
          ditto "$APP" "$STAGE/$(basename "$APP")"
          ln -s /Applications "$STAGE/Applications"
          OUT="release/iML-Editor-Lite-${VERSION}-${{ matrix.arch }}.dmg"
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "iML 编辑器" -srcfolder "$STAGE" -ov -format ULMO -fs HFS+ "$OUT"; then break; fi
            if [ "$attempt" = 5 ]; then echo "hdiutil 连续 5 次失败"; exit 1; fi
            echo "hdiutil 第 $attempt 次失败，稍等重试"; sleep $((attempt * 10))
          done
          ls -la release
      # Windows：安装包的文件名里带中文的应用名，GitHub Release 的附件名放不了中文；
      # 应用里的检查更新又靠文件名里的架构（arm64 / x64）挑安装包——改成英文名
      - name: Rename installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name '*-setup.exe' -exec cp {} "release/iML-Editor-Lite-Setup-${VERSION}-${{ matrix.arch }}.exe" \;
          ls -la release
      # Windows 的绿色版：不用安装，解压就用——压缩包里就是安装程序会装上的那个 exe。
      # 应用靠旁边有没有 uninstall.exe 认自己是不是绿色版（lib.rs 的 is_portable），检查更新时给对应的那一种
      - name: Pack portable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="$PWD/release/iML-Editor-Lite-Portable-${VERSION}-${{ matrix.arch }}.zip"
          cd "src-tauri/target/${{ matrix.target }}/release"
          7z a -tzip -mx=9 "$OUT" iml-editor.exe
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pick release notes
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#lite-v}"
          NOTES="docs/release-notes-lite-${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="release-notes.generated.md"
            printf '## %s\n\n见 README。\n' "$VERSION" > "$NOTES"
          fi
          # Release 标题取发布说明的第一个标题（「## 26.2.0 — 放心把笔记搬进来」→「v26.2.0 — 放心把笔记搬进来」），
          # 不写死在这里：上一版的口号留到下一版就成了笑话
          SLOGAN=$(grep -m1 '^#' "$NOTES" | sed -E 's/^#+[[:space:]]*v?[0-9.]+[[:space:]]*(—|-)*[[:space:]]*//')
          NAME="iML 编辑器 $VERSION"
          if [ -n "$SLOGAN" ] && [ "$SLOGAN" != "$TAG" ]; then NAME="$NAME — $SLOGAN"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "file=$NOTES" >> "$GITHUB_OUTPUT"
          echo "Release 标题：$NAME"
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          prerelease: false
          make_latest: 'false'
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.zip
